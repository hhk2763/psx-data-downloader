# PSX dataset registry — daily, date-keyed downloads.
#
# Source of truth for this file is the dataset table in CLAUDE.md.
# Adding a dataset means adding an entry here; no code change is needed.
#
# URL pattern:  {base_url}/download/{key}/{YYYY-MM-DD}.{ext}
#
# first_available: the earliest date the dataset exists on the site. `null`
# until `cli.py probe` (Phase 2) discovers it. While null, fetch has no lower
# bound and early dates simply record as `missing`.

datasets:
  # ---- Market Summary -------------------------------------------------
  - key: mkt_summary
    label: Market Summary (Closing)
    section: Market Summary
    exts: ["Z"]
    first_available: null

  - key: closing_rates
